name: Build PicoTube Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# ⚠️ SECURITY NOTE: This workflow never logs or exposes the GitHub token.
# It only uses secrets defined in the repo's "Secrets and variables" settings.
# The user's PAT is only used by the main agent (out-of-band) to push code
# to the repo and trigger this workflow — it is NEVER committed to source.

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled + accept licenses)
        run: |
          # GitHub's ubuntu-latest runner already has the Android SDK at
          # /usr/local/lib/android/sdk. We accept all licenses non-interactively
          # (the auto-accept in android-actions/setup-android@v3 hangs on the
          # newer XR/TV licenses that require interactive 'y' input).
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Accept all licenses non-interactively.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install the SDK components Capacitor/Gradle need.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK ready."

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Install dependencies
        run: bun install --frozen-lockfile=false

      - name: Install Capacitor CLI
        run: bun add -D @capacitor/cli@^6.1.2

      - name: Install Capacitor core + Android plugin
        run: |
          bun add @capacitor/core@^6.1.2 \
                  @capacitor/android@^6.1.2 \
                  @capacitor/app@^6.0.1 \
                  @capacitor/splash-screen@^6.0.2 \
                  @capacitor/status-bar@^6.0.1 \
                  @capacitor/filesystem@^6.0.1 \
                  @capacitor/preferences@^6.0.2

      - name: Build Next.js static export (Capacitor mode)
        env:
          NEXT_CONFIG_CAPACITOR: "1"
        run: |
          # Static export can't include dynamic API routes (Next.js 16
          # requires every route to be `force-static` when output: "export"
          # is set). The frontend uses client-side fetching via CORS proxy
          # when running inside the APK (see src/lib/api-client.ts), so the
          # server-side API routes aren't needed.
          #
          # We delete them BEFORE building so the static export succeeds.
          rm -rf src/app/api

          # Build with the capacitor-specific Next config (output: 'export').
          # This produces a `out/` directory with static HTML/JS/CSS — no
          # API routes, no server. Capacitor bundles these files.
          NEXT_CONFIG_CAPACITOR=1 bunx next build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          # Always copy the latest webDir to the Android project.
          bunx cap sync android

      - name: Patch MainActivity for PIP + fullscreen + landscape
        run: |
          # Inject PIP support + fullscreen + landscape-on-watch into the
          # Android MainActivity. We do this in the workflow (not in a
          # committed file) because `cap add android` regenerates the
          # MainActivity on first run; doing it here means the patch always
          # applies cleanly.
          MAIN_ACTIVITY="android/app/src/main/java/com/picotube/net/MainActivity.java"
          mkdir -p "$(dirname "$MAIN_ACTIVITY")"
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package com.picotube.net;

          import android.os.Bundle;
          import android.app.PictureInPictureParams;
          import android.util.Rational;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.content.res.Configuration;
          import android.os.Build;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // Enter fullscreen — hide status + nav bars for true app-like UX.
              // The PicoTube UI uses safe-area-insets to keep content
              // visible; this lets the WebView use the full screen.
              getWindow().setFlags(
                WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
              );

              // Enable PIP automatically when the user presses Home while a
              // video is playing. The WebView signals this via the
              // setPictureInPictureParams API exposed by the plugin.
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                PictureInPictureParams params = new PictureInPictureParams.Builder()
                  .setAspectRatio(new Rational(16, 9))
                  .build();
                setPictureInPictureParams(params);
              }
            }

            @Override
            public void onUserLeaveHint() {
              // Enter PIP when the user presses Home — this is the "only the
              // video enters PIP" requirement. The whole Activity shrinks
              // to a small floating window; the WebView inside it
              // (which is just the YouTube iframe) continues playing.
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                try {
                  PictureInPictureParams params = new PictureInPictureParams.Builder()
                    .setAspectRatio(new Rational(16, 9))
                    .build();
                  enterPictureInPictureMode(params);
                } catch (Exception e) {
                  // ignore
                }
              }
            }
          }
          JAVA

      - name: Patch AndroidManifest.xml for permissions + features
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          import re
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              m = f.read()

          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
          ]
          needed = [p for p in perms if f"android.permission.{p.split('.')[-1]}" not in m]
          # Insert just inside <manifest> after the application tag's predecessor.
          perm_block = "\n".join(f'    <uses-permission android:name="{p}" />' for p in needed)

          # Add supportsPictureInPicture + configChanges + resizeableActivity
          # to the <application> tag.
          m = re.sub(
              r'(<application[^>]*?)(/?>)',
              r'\1 android:supportsPictureInPicture="true" android:resizeableActivity="true" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode" android:hardwareAccelerated="true"\2',
              m, count=1
          )

          # Inject permissions before <application>.
          m = re.sub(
              r'(\s*<application)',
              "\n    " + perm_block + r"\1",
              m, count=1
          )

          # Insert android:screenOrientation="fullSensor" so the user can
          # rotate freely (we don't force landscape — but if they're already
          # in landscape, the next video keeps landscape).
          m = re.sub(
              r'(<activity[^>]*?android:name="com.picotube.net.MainActivity"[^>]*?)(/?>)',
              r'\1 android:screenOrientation="fullSensor" android:launchMode="singleTop"\2',
              m, count=1
          )

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(m)
          PY

      - name: Patch strings.xml for app name
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "$STRINGS")"
          cat > "$STRINGS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PicoTube</string>
              <string name="title_activity_main">PicoTube</string>
              <string name="package_name">com.picotube.net</string>
              <string name="custom_url_scheme">com.picotube.net</string>
          </resources>
          XML

      - name: Copy PicoTube logo as Android app icon
        run: |
          # Generate all required Android launcher icon sizes from the
          # PicoTube logo we put in /public/icon.png at build time.
          mkdir -p /tmp/icons
          convert -background none public/icon.png -resize 48x48   /tmp/icons/mdpi.png
          convert -background none public/icon.png -resize 72x72   /tmp/icons/hdpi.png
          convert -background none public/icon.png -resize 96x96   /tmp/icons/xhdpi.png
          convert -background none public/icon.png -resize 144x144 /tmp/icons/xxhdpi.png
          convert -background none public/icon.png -resize 192x192 /tmp/icons/xxxhdpi.png

          # Round versions for the round launcher icon.
          for s in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            size=$(echo "$s" | sed 's/mdpi/48/; s/hdpi/72/; s/xhdpi/96/; s/xxhdpi/144/; s/xxxhdpi/192/')
            convert -background none public/icon.png -resize ${size}x${size} \
              \( +clone -alpha O -channel A -blur 0x${size} -level 0,0 +channel \) \
              -compose DstIn -composite /tmp/icons/round_${s}.png
          done

          # Replace the default Android launcher icons.
          for s in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-${s}"
            mkdir -p "$target"
            cp /tmp/icons/${s}.png "$target/ic_launcher.png"
            cp /tmp/icons/round_${s}.png "$target/ic_launcher_round.png"
          done

          # Also generate the Play Store / marketing icon (512x512).
          convert -background none public/icon.png -resize 512x512 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          # Copy to a known location with a friendly name.
          mkdir -p android/release
          cp "$APK" "android/release/PicoTube-debug.apk"
          echo "apk_release=android/release/PicoTube-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoTube-debug-apk
          path: ${{ steps.find_apk.outputs.apk_release }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to /android folder on the repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Commit the APK to a special branch (apk-builds) so the user can
          # download it directly from GitHub without going through Actions.
          # The /android/ folder is in .gitignore so we use -f to force-add.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b apk-builds || git checkout apk-builds
          mkdir -p android
          cp ${{ steps.find_apk.outputs.apk_release }} android/PicoTube-debug.apk
          git add -f android/PicoTube-debug.apk
          # Always succeed — commit returns non-zero if there's nothing to commit.
          git commit -m "Update APK (build $(date -u +%Y-%m-%d-%H%M))" || echo "No changes to commit"
          git push origin apk-builds --force-with-lease || true
