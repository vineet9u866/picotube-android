name: Build PicoTube Android APK

# Grant the auto-generated GITHUB_TOKEN write permission so the workflow
# can push the APK to the apk-builds branch. Without this, the
# "Commit APK to /android folder" step fails with a 403 from GitHub.
permissions:
  contents: write

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# ⚠️ SECURITY NOTE: This workflow never logs or exposes the GitHub token.
# It only uses secrets defined in the repo's "Secrets and variables" settings.
# The user's PAT is only used by the main agent (out-of-band) to push code
# to the repo and trigger this workflow — it is NEVER committed to source.

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled + accept licenses + SDK 35)
        run: |
          # GitHub's ubuntu-latest runner has the Android SDK at
          # /usr/local/lib/android/sdk. We accept all licenses non-
          # interactively (android-actions/setup-android@v3 hangs on the
          # newer XR/TV licenses that require interactive 'y' input) and
          # install SDK 35 so we can compile with compileSdk=35.
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Accept all licenses non-interactively.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install the SDK components Capacitor/Gradle need — including
          # SDK 35 (Android 15) and SDK 34 (Android 14) for compile/target.
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "SDK ready (incl. SDK 35)."

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Install dependencies
        run: bun install

      - name: Install Capacitor CLI
        run: bun add -D @capacitor/cli@^6.1.2

      - name: Install Capacitor core + Android plugin
        run: |
          bun add @capacitor/core@^6.1.2 \
                  @capacitor/android@^6.1.2 \
                  @capacitor/app@^6.0.1 \
                  @capacitor/splash-screen@^6.0.2 \
                  @capacitor/status-bar@^6.0.1 \
                  @capacitor/filesystem@^6.0.1 \
                  @capacitor/preferences@^6.0.2

      - name: Build Next.js static export (Capacitor mode)
        env:
          NEXT_CONFIG_CAPACITOR: "1"
        run: |
          # Static export can't include dynamic API routes (Next.js 16
          # requires every route to be `force-static` when output: "export"
          # is set). The frontend uses client-side fetching via CORS proxy
          # when running inside the APK (see src/lib/api-client.ts), so the
          # server-side API routes aren't needed.
          rm -rf src/app/api
          NEXT_CONFIG_CAPACITOR=1 bunx next build

      - name: Add Android platform (if missing or incomplete)
        run: |
          # `cap add android` creates the full Android project structure
          # (build.gradle, settings.gradle, gradle wrapper, app/, etc.).
          # We always run it if android/build.gradle is missing — even if
          # the android/ directory itself exists, a previous run might
          # have left it in a partial state.
          if [ ! -f "android/build.gradle" ]; then
            rm -rf android
            bunx cap add android
          fi
          # Sync Capacitor plugins + copy web assets into the Android project.
          bunx cap sync android
          # Sanity-check that build.gradle was created (or existed).
          test -f android/build.gradle || {
            echo "ERROR: android/build.gradle still missing after cap add + sync"
            ls -la android/ 2>&1 || true
            exit 1
          }

      - name: Apply committed Android patches
        run: |
          # Replace the auto-generated Android files with our committed
          # patches (see android-patches/README.md for what each file does).
          # These patches:
          #   - Fix Android 14 crashes (PIP feature check, no
          #     FLAG_LAYOUT_NO_LIMITS, no setPictureInPictureParams in onCreate)
          #   - Target Android 14 (targetSdk=34) with Android 15 readiness
          #     (compileSdk=35)
          #   - Add proper permissions (scoped storage, no MANAGE_EXTERNAL_STORAGE)
          #   - Add android:exported="true" to MainActivity (Android 12+ requirement)
          #
          # We DON'T patch build.gradle / gradle-wrapper.properties —
          # Capacitor 6.1.2's defaults (AGP 8.2.1 + Gradle 8.7) work with
          # compileSdk=35. Higher AGP versions broke Capacitor's
          # capacitor.settings.gradle include() call.
          set -e
          mkdir -p android/app/src/main/java/com/picotube/net
          cp android-patches/MainActivity.java \
             android/app/src/main/java/com/picotube/net/MainActivity.java
          cp android-patches/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          cp android-patches/strings.xml \
             android/app/src/main/res/values/strings.xml
          cp android-patches/variables.gradle android/variables.gradle
          echo "Applied patches:"
          ls -la android-patches/

      - name: Verify Gradle config (sanity)
        run: |
          echo "=== variables.gradle ==="
          cat android/variables.gradle
          echo ""
          echo "=== Top-level build.gradle ==="
          cat android/build.gradle
          echo ""
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "=== gradle-wrapper.properties ==="
            cat android/gradle/wrapper/gradle-wrapper.properties
            echo ""
          fi
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Copy PicoTube logo as Android app icon
        run: |
          # Generate all required Android launcher icon sizes from the
          # PicoTube logo in /public/icon.png. We use ImageMagick (install
          # it first since it's not preinstalled on ubuntu-latest).
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null 2>&1
          mkdir -p /tmp/icons
          convert -background none public/icon.png -resize 48x48   /tmp/icons/mdpi.png
          convert -background none public/icon.png -resize 72x72   /tmp/icons/hdpi.png
          convert -background none public/icon.png -resize 96x96   /tmp/icons/xhdpi.png
          convert -background none public/icon.png -resize 144x144 /tmp/icons/xxhdpi.png
          convert -background none public/icon.png -resize 192x192 /tmp/icons/xxxhdpi.png

          # Replace the default Android launcher icons (both standard and round).
          for s in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-${s}"
            mkdir -p "$target"
            cp /tmp/icons/${s}.png "$target/ic_launcher.png"
            cp /tmp/icons/${s}.png "$target/ic_launcher_round.png"
          done

          # Also generate the Play Store / marketing icon (512x512).
          convert -background none public/icon.png -resize 512x512 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # --no-daemon: avoids state issues in CI
          # --stacktrace: prints full stack traces on failures
          # --warning-mode all: shows all deprecation warnings
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build-output.log
          # Surface any deprecation warnings about Android 15 changes.
          grep -E "DEPRECATION|deprecated|Android 15|targetSdk" build-output.log || true

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          mkdir -p android/release
          cp "$APK" "android/release/PicoTube-debug.apk"
          echo "apk_release=android/release/PicoTube-debug.apk" >> $GITHUB_OUTPUT
          echo "=== APK info ==="
          ls -la android/release/PicoTube-debug.apk
          file android/release/PicoTube-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoTube-debug-apk
          path: ${{ steps.find_apk.outputs.apk_release }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to /android folder on the repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Commit the APK to a special branch (apk-builds) so the user can
          # download it directly from GitHub without going through Actions.
          # The /android/ folder is in .gitignore so we use -f to force-add.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b apk-builds || git checkout apk-builds
          mkdir -p android
          cp ${{ steps.find_apk.outputs.apk_release }} android/PicoTube-debug.apk
          git add -f android/PicoTube-debug.apk
          git commit -m "Update APK (build $(date -u +%Y-%m-%d-%H%M))" || echo "No changes to commit"
          git push origin apk-builds --force-with-lease || true
